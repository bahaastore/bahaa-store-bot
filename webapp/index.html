<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002623">
<title>بهاء ستور</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=1">
<script>
  try {
    var t = localStorage.getItem("bs_theme") ||
      (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme) ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">ب</span>
      <div class="brand-txt">
        <b id="store-name">بهاء ستور</b>
        <small>للمنتجات الرقمية</small>
      </div>
    </div>
    <div class="top-actions">
      <button class="bal" id="bal-btn" aria-label="الرصيد — اضغط للتبديل بين الدولار والليرة">
        <span class="bal-lbl">رصيدك</span>
        <b id="bal">—</b>
      </button>
      <button class="icon-btn" id="theme-btn" aria-label="الوضع الليلي">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>
  <div class="demo-bar" id="demo-bar" hidden>وضع تجريبي — المنتجات والأسعار للعرض فقط، ولا يتم أي خصم حقيقي.</div>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="التنقل">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="#orders" data-tab="orders">
      <svg viewBox="0 0 24 24"><path d="M6 2h12l2 4v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6zM4 6h16M9 11h6M9 15h6"/></svg>
      <span>طلباتي</span>
    </a>
    <a href="#topup" data-tab="topup" class="tab-main">
      <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>الشحن</span>
    </a>
    <a href="#deposits" data-tab="deposits">
      <svg viewBox="0 0 24 24"><path d="M3 7h18v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 7l2-3h14l2 3M16 13.5h2"/></svg>
      <span>الإيداعات</span>
    </a>
    <a href="#account" data-tab="account">
      <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM3.5 21a8.5 8.5 0 0 1 17 0"/></svg>
      <span>حسابي</span>
    </a>
  </nav>
</div>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grip"></div>
  <div id="sheet-body"></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="assets/app.js?v=1"></script>
</body>
</html>
